name: Terraform CI
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terraform:
    name: Terraform root
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@472c0c5bebe7f07aca8c51c7fabf0a47280a0b25
    with:
      template-ref: 472c0c5bebe7f07aca8c51c7fabf0a47280a0b25
      directory: .
      test-directory: tests
  examples:
    name: Example ${{ matrix.region }}/${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {region: uks, environment: hub}
          - {region: uks, environment: pprd}
          - {region: uks, environment: prd}
          - {region: ukw, environment: hub}
          - {region: ukw, environment: bcdr}
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@472c0c5bebe7f07aca8c51c7fabf0a47280a0b25
    with:
      template-ref: 472c0c5bebe7f07aca8c51c7fabf0a47280a0b25
      directory: .
      test-directory: tests/targets
      var-files: |
        config/global.tfvars
        config/${{ matrix.region }}/${{ matrix.environment }}/${{ matrix.environment }}.tfvars

  hub-spoke:
    name: Hub-spoke ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: [hub, pprd, prd]
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@472c0c5bebe7f07aca8c51c7fabf0a47280a0b25
    with:
      template-ref: 472c0c5bebe7f07aca8c51c7fabf0a47280a0b25
      directory: .
      test-directory: tests/hub-spoke
      var-files: |
        examples/hub-spoke/config/global.tfvars
        examples/hub-spoke/config/uks/${{ matrix.environment }}/${{ matrix.environment }}.tfvars
  egress:
    name: Hub firewall egress
    uses: MikeeeGit/terraform-delivery-templates/.github/workflows/terraform-validate.yml@472c0c5bebe7f07aca8c51c7fabf0a47280a0b25
    with:
      template-ref: 472c0c5bebe7f07aca8c51c7fabf0a47280a0b25
      directory: examples/hub-spoke/egress
      test-directory: tests
