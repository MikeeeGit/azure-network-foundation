# Azure Repos PR checks are enforced by main branch build-validation policy.
trigger:
  branches:
    include: [main, develop]
pr:
  branches:
    include: [main, develop]
resources:
  repositories:
    - repository: deliveryTemplates
      type: git
      name: terraform-delivery-templates
      ref: 472c0c5bebe7f07aca8c51c7fabf0a47280a0b25
jobs:
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: TerraformRoot
      directory: .
      testDirectory: tests
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_uks_hub
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/uks/hub/hub.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_uks_pprd
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/uks/pprd/pprd.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_uks_prd
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/uks/prd/prd.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_ukw_hub
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/ukw/hub/hub.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: Example_ukw_bcdr
      directory: .
      testDirectory: tests/targets
      varFiles: |
        config/global.tfvars
        config/ukw/bcdr/bcdr.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: HubSpoke_hub
      directory: .
      testDirectory: tests/hub-spoke
      varFiles: |
        examples/hub-spoke/config/global.tfvars
        examples/hub-spoke/config/uks/hub/hub.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: HubSpoke_pprd
      directory: .
      testDirectory: tests/hub-spoke
      varFiles: |
        examples/hub-spoke/config/global.tfvars
        examples/hub-spoke/config/uks/pprd/pprd.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: HubSpoke_prd
      directory: .
      testDirectory: tests/hub-spoke
      varFiles: |
        examples/hub-spoke/config/global.tfvars
        examples/hub-spoke/config/uks/prd/prd.tfvars
  - template: azure-pipelines/jobs/terraform-validate.yml@deliveryTemplates
    parameters:
      jobName: HubFirewallEgress
      directory: examples/hub-spoke/egress
      testDirectory: tests
